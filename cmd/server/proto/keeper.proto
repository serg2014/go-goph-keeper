syntax = "proto3";

package gophkeeper;

option go_package = "github.com/serg2014/go-goph-keeper/cmd/server/proto";

message RegisterUserRequest{
    string login = 1;
    string password = 2;
}
message JWTToken {
    string token = 1;
}
message RegisterUserResponse{
    JWTToken access = 1;
    JWTToken refresh = 2;
}
message AuthUserRequest{
    string login = 1;
    string password = 2;
}
message AuthUserResponse{
    JWTToken access = 1;
    JWTToken refresh = 2;
}

message RenewAuthRequest{}
message RenewAuthResponse {
    JWTToken access = 1;
    JWTToken refresh = 2;
}
service AuthService {
    rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
    rpc AuthUser(AuthUserRequest) returns (AuthUserResponse);
    rpc RenewAuth(RenewAuthRequest) returns (RenewAuthResponse);
}

message PingRequest {}
message PingResponse {}

message SecretData {
    int64 id = 1;
    int64 updated_at = 2;
    bytes data = 3;
}
message Secret {
    int64 id = 1;
    SecretData meta = 2;
    SecretData data = 3;
}
message CreateSecretRequest{
    Secret secret = 1;
}

message SecretDataLite {
    int64 id = 1;
    uint64 server_id = 2;
    uint64 version = 3;
}
message SecretLite {
    int64 id = 1;
    uint64 server_id = 2;
    SecretDataLite meta = 3;
    SecretDataLite data = 4;
}
message CreateSecretResponse{
    SecretLite secret = 1;
}

service GophKeeperService {
    rpc Ping(PingRequest) returns (PingResponse);
    rpc CreateSecrets(stream CreateSecretRequest) returns (stream CreateSecretResponse);
}
