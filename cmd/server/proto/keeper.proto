syntax = "proto3";

package gophkeeper;

option go_package = "github.com/serg2014/go-goph-keeper/cmd/server/proto";

message RegisterUserRequest{
    string login = 1;
    string password = 2;
}
message JWTToken {
    string token = 1;
}
message RegisterUserResponse{
    JWTToken access = 1;
    JWTToken refresh = 2;
}
message AuthUserRequest{
    string login = 1;
    string password = 2;
}
message AuthUserResponse{
    JWTToken access = 1;
    JWTToken refresh = 2;
}

message RenewAuthRequest{}
message RenewAuthResponse {
    JWTToken access = 1;
    JWTToken refresh = 2;
}
service AuthService {
    rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
    rpc AuthUser(AuthUserRequest) returns (AuthUserResponse);
    rpc RenewAuth(RenewAuthRequest) returns (RenewAuthResponse);
}

message PingRequest {}
message PingResponse {}

message SecretData {
    int64 id = 1;
    int64 updated_at = 2;
    bytes data = 3;
}
message Secret {
    int64 id = 1;
    SecretData meta = 2;
    SecretData data = 3;
}
message CreateSecretRequest{
    Secret secret = 1;
}

message SecretDataLite {
    int64 id = 1;
    int64 server_id = 2;
}
message SecretLite {
    SecretDataLite secret = 1;
    SecretDataLite meta = 2;
    SecretDataLite data = 3;
}
message CreateSecretResponse{
    SecretLite secret = 1;
}

message SecretDataUpdate {
    int64 id = 1;
    int64 updated_at = 2;
    int64 version = 3;
    bytes data = 4;  
}
message SecretUpdate {
    int64 id = 1;
    SecretDataUpdate meta = 2;
    SecretDataUpdate data = 3;
}
message UpdateSecretRequest {
    SecretUpdate secret = 1;
}

message SecretDataLiteUpdate {
    int64 id = 1;
    int64 version = 2;
    bool conflict = 3;
}
message SecretLiteUpdate {
    int64 id = 1;
    SecretDataLiteUpdate meta = 2;
    SecretDataLiteUpdate data = 3;
}
message UpdateSecretResponse {
    SecretLiteUpdate secret = 1;
}

service GophKeeperService {
    rpc Ping(PingRequest) returns (PingResponse);
    rpc CreateSecrets(stream CreateSecretRequest) returns (stream CreateSecretResponse);
    rpc UpdateSecrets(stream UpdateSecretRequest) returns (stream UpdateSecretResponse);
}
